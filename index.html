<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TORREMAR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #game { display:block; width:100vw; height:100vh; background:#000; cursor:none; }
  body.free #game { cursor:crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* =====================================================================
   T O R R E M A R   -   FPS 2.5D estilo DOOM
   Raycasting DDA + billboards con Z-Buffer 1D + colision circular
   100% procedural: ni librerias ni assets externos.
   ===================================================================== */

/* ---------------------------- UTILIDADES ---------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a, b) => a + Math.random() * (b - a);
const rndi  = (a, b) => Math.floor(rnd(a, b + 1));
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const dist  = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

const EMOJI  = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",system-ui,sans-serif';
const HUDF   = 'Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif';

function hex2rgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
}
function rgbStr(c) { return 'rgb(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ')'; }
function mix(c1, c2, t) { return [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)]; }
function mul(c, f) { return [clamp(c[0]*f,0,255), clamp(c[1]*f,0,255), clamp(c[2]*f,0,255)]; }

/* ------------------------------ EL MAPA -----------------------------
   Numeros 1..5 -> paredes de cada zona (color/patron distinto)
   '.'  suelo | P jugador | M Matematicas | E Ed.Fisica | I Inspector
   R Roberto | D David | A Arturo | J Jorge Coronel (jefe final)
   a municion | h botiquin | r armadura | x examen sorpresa
   -------------------------------------------------------------------- */
const MAP_SRC = [
  "1111111111111111111111111111111111111111", // 0
  "1...........h...1......2..........h....2", // 1
  "1..M............1......2...M.......a...2", // 2
  "1...............1......2....2.....2....2", // 3
  "1...1.......1...1......2...............2", // 4
  "1......a.......................R.......2", // 5
  "1..........E...........................2", // 6
  "1...1.......1...1......2...............2", // 7
  "1...............1...I..2...........M...2", // 8
  "1.P............a1......2..a............2", // 9
  "1...............1......2....2.....2....2", // 10
  "1111111..11111111......2222222..22222222", // 11
  "3..........a....3......4..M............4", // 12
  "3..E............3......4............a..4", // 13
  "3...............3..a...4...444...444...4", // 14
  "3.....3333......3......4...444...444...4", // 15
  "3.....3333.............................4", // 16
  "3.......D......................A.......4", // 17
  "3...............3......4...............4", // 18
  "3...............3....M.4...............4", // 19
  "3............E..3......4...........I...4", // 20
  "3.r...........x.3......4..h............4", // 21
  "3333333..33333333......4444444..44444444", // 22
  "5.h..................................r.5", // 23
  "5......................................5", // 24
  "5.....E..........................E.....5", // 25
  "5.....5.....5..............5.....5.....5", // 26
  "5..............M........M..............5", // 27
  "5...................J..................5", // 28
  "5......................................5", // 29
  "5.........I..................I.........5", // 30
  "5.a.................x................a.5", // 31
  "5......................................5", // 32
  "5555555555555555555555555555555555555555"  // 33
];
const MAP_W = MAP_SRC[0].length;
const MAP_H = MAP_SRC.length;
let grid = null;                       // Uint8Array con el tipo de pared (0 = libre)
const cell = (x, y) => (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) ? 1 : grid[y * MAP_W + x];
const isWall = (x, y) => cell(x, y) !== 0;

/* -------------------- ZONAS: COLOR Y TEXTURA DE PARED ---------------- */
const ZONES = {
  1: { name:'AULAS',        base:'#c49a61', trim:'#6d5432', rows:5, pattern:'brick',  wains:'#7a5c33' },
  2: { name:'PASILLO',      base:'#4b8f6d', trim:'#22503b', rows:4, pattern:'tile',   wains:'#2c5a44' },
  3: { name:'GIMNASIO',     base:'#b04a41', trim:'#5c211d', rows:3, pattern:'panel',  wains:'#6d2b25' },
  4: { name:'LABORATORIO',  base:'#4670ad', trim:'#1e3557', rows:6, pattern:'brick',  wains:'#274067' },
  5: { name:'AUDITORIO',    base:'#5b4079', rim:'#2a1c3c', trim:'#2a1c3c', rows:8, pattern:'stripe', wains:'#33234a' }
};
const FOG = hex2rgb('#0a0a14');
const LEVELS = 32;                     // niveles de sombreado precalculados
const PAL = {};                        // PAL[tipo][lado][nivel] -> {base, trim, wains}
(function buildPalette() {
  for (const k in ZONES) {
    const z = ZONES[k];
    const base = hex2rgb(z.base), trim = hex2rgb(z.trim), wains = hex2rgb(z.wains);
    PAL[k] = [[], []];
    for (let side = 0; side < 2; side++) {
      const sf = side === 0 ? 1 : 0.72;               // caras N/S mas oscuras
      for (let l = 0; l < LEVELS; l++) {
        const t = l / (LEVELS - 1);                    // 0 = cerca, 1 = lejos
        PAL[k][side].push({
          base:  rgbStr(mix(mul(base,  sf), FOG, t)),
          trim:  rgbStr(mix(mul(trim,  sf), FOG, t)),
          wains: rgbStr(mix(mul(wains, sf), FOG, t))
        });
      }
    }
  }
})();
const fogLevel = (d) => clamp((Math.sqrt(d / 44) * LEVELS) | 0, 0, LEVELS - 1);

/* =====================================================================
   SUELOS Y TECHOS TEXTURIZADOS  (floor casting por pixel)
   Cada celda libre hereda la zona de la pared mas cercana, de modo que
   cada sala tiene su propio solado y su propio falso techo.
   ===================================================================== */
const TEXS = 64, TEXM = 63, TEXSH = 6;        // textura 64x64
const MIPS = 16, MIPM = 15, MIPSH = 4;        // mip para las filas lejanas
const SHADES = 16;                            // niveles de sombreado precalculados
const FOGPIX = (255 << 24) | (FOG[2] << 16) | (FOG[1] << 8) | FOG[0];
let zoneOf = null;                            // zona (1..5) de cada celda del mapa
const FLOORTEX = {}, CEILTEX = {};            // [zona][nivel] -> Uint32Array(64*64)
const shadeLevel = (d) => clamp((Math.sqrt(d / 40) * SHADES) | 0, 0, SHADES - 1);

/* zona de cada celda: rectangulos de sala (las paredes conservan su tipo) */
const ROOMS = [
  { x0: 0,  y0: 0,  x1: 15, y1: 11, z: 1 },   // aulas (ala izquierda)
  { x0: 24, y0: 0,  x1: 39, y1: 11, z: 2 },   // aula del ala derecha
  { x0: 16, y0: 0,  x1: 23, y1: 22, z: 2 },   // pasillo central
  { x0: 0,  y0: 12, x1: 15, y1: 22, z: 3 },   // gimnasio
  { x0: 24, y0: 12, x1: 39, y1: 22, z: 4 },   // laboratorio
  { x0: 0,  y0: 23, x1: 39, y1: 33, z: 5 }    // auditorio
];
function zoneAt(x, y) {
  for (const r of ROOMS) if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) return r.z;
  return 2;
}
function buildZoneMap() {
  zoneOf = new Uint8Array(MAP_W * MAP_H);
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const i = y * MAP_W + x;
      zoneOf[i] = grid[i] ? grid[i] : zoneAt(x, y);
    }
  }
}

/* dibujo procedural de una textura de 64x64: se hornean 16 niveles de
   sombreado y un mip de 16x16 para las filas lejanas (evita el hormigueo) */
function bakeTexture(drawFn) {
  const cn = makeCanvas(TEXS, TEXS);
  const c = cn.getContext('2d');
  c.textAlign = 'center'; c.textBaseline = 'middle';
  drawFn(c, TEXS, TEXS);
  const src = c.getImageData(0, 0, TEXS, TEXS).data;
  const full = [], mip = [];
  /* promedio de bloques 4x4 -> mip de 16x16 */
  const avg = new Float64Array(MIPS * MIPS * 3);
  const blk = TEXS / MIPS;
  for (let y = 0; y < TEXS; y++) {
    for (let x = 0; x < TEXS; x++) {
      const j = (y * TEXS + x) * 4;
      const m = (((y / blk) | 0) * MIPS + ((x / blk) | 0)) * 3;
      avg[m] += src[j]; avg[m + 1] += src[j + 1]; avg[m + 2] += src[j + 2];
    }
  }
  const div = blk * blk;
  for (let l = 0; l < SHADES; l++) {
    const t = l / (SHADES - 1);
    const a = new Uint32Array(TEXS * TEXS);
    for (let i = 0, j = 0; i < a.length; i++, j += 4) {
      const r = lerp(src[j], FOG[0], t) | 0, g = lerp(src[j + 1], FOG[1], t) | 0, b = lerp(src[j + 2], FOG[2], t) | 0;
      a[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    full.push(a);
    const m = new Uint32Array(MIPS * MIPS);
    for (let i = 0; i < m.length; i++) {
      const r = lerp(avg[i * 3] / div, FOG[0], t) | 0;
      const g = lerp(avg[i * 3 + 1] / div, FOG[1], t) | 0;
      const b = lerp(avg[i * 3 + 2] / div, FOG[2], t) | 0;
      m[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    mip.push(m);
  }
  return { full: full, mip: mip };
}
function noiseOver(c, W, H, amount, alpha) {
  for (let i = 0; i < amount; i++) {
    c.fillStyle = 'rgba(0,0,0,' + (alpha * Math.random()).toFixed(3) + ')';
    c.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 1 + ((Math.random() * 3) | 0), 1);
  }
}
function buildFloorTextures() {
  const floors = {
    /* aulas: tarima de madera */
    1: (c, W, H) => {
      c.fillStyle = '#8a5f36'; c.fillRect(0, 0, W, H);
      for (let i = 0; i < 4; i++) {
        c.fillStyle = i % 2 ? '#7d5530' : '#93673c';
        c.fillRect(0, i * 16, W, 16);
        c.fillStyle = 'rgba(60,36,18,0.55)'; c.fillRect(0, i * 16 + 15, W, 1);
        c.fillRect((i * 23) % W, i * 16, 1, 16);
      }
      noiseOver(c, W, H, 120, 0.18);
    },
    /* pasillo: terrazo en damero */
    2: (c, W, H) => {
      c.fillStyle = '#cfd3c4'; c.fillRect(0, 0, W, H);
      c.fillStyle = '#8fa08b';
      c.fillRect(0, 0, 32, 32); c.fillRect(32, 32, 32, 32);
      c.fillStyle = 'rgba(40,50,40,0.5)';
      c.fillRect(0, 31, W, 2); c.fillRect(31, 0, 2, H);
      noiseOver(c, W, H, 150, 0.16);
    },
    /* gimnasio: parquet con lineas pintadas */
    3: (c, W, H) => {
      c.fillStyle = '#c08a48'; c.fillRect(0, 0, W, H);
      for (let i = 0; i < 8; i++) {
        c.fillStyle = i % 2 ? '#b8813f' : '#c9944f';
        c.fillRect(0, i * 8, W, 8);
        c.fillStyle = 'rgba(90,58,24,0.45)'; c.fillRect(0, i * 8 + 7, W, 1);
      }
      c.fillStyle = 'rgba(242,242,238,0.55)'; c.fillRect(0, 29, W, 3);
      noiseOver(c, W, H, 110, 0.15);
    },
    /* laboratorio: baldosa tecnica */
    4: (c, W, H) => {
      c.fillStyle = '#5c6b7d'; c.fillRect(0, 0, W, H);
      c.fillStyle = '#67788c';
      c.fillRect(1, 1, 30, 30); c.fillRect(33, 1, 30, 30);
      c.fillRect(1, 33, 30, 30); c.fillRect(33, 33, 30, 30);
      c.fillStyle = 'rgba(20,28,40,0.6)';
      c.fillRect(0, 0, W, 1); c.fillRect(0, 32, W, 1);
      c.fillRect(0, 0, 1, H); c.fillRect(32, 0, 1, H);
      noiseOver(c, W, H, 130, 0.14);
    },
    /* auditorio: moqueta */
    5: (c, W, H) => {
      c.fillStyle = '#6d2029'; c.fillRect(0, 0, W, H);
      for (let y = 0; y < H; y += 4) {
        c.fillStyle = (y / 4) % 2 ? 'rgba(140,40,50,0.35)' : 'rgba(40,10,14,0.35)';
        c.fillRect(0, y, W, 2);
      }
      c.fillStyle = 'rgba(210,170,90,0.5)';
      c.fillRect(30, 0, 4, H); c.fillRect(0, 30, W, 4);
      noiseOver(c, W, H, 220, 0.2);
    }
  };
  const ceils = {
    1: '#6f6a60', 2: '#77837a', 3: '#6b5450', 4: '#5b6675', 5: '#3d3050'
  };
  for (const k in floors) {
    FLOORTEX[k] = bakeTexture(floors[k]);
    CEILTEX[k] = bakeTexture((c, W, H) => {          /* placas de escayola + luminaria */
      c.fillStyle = ceils[k]; c.fillRect(0, 0, W, H);
      c.fillStyle = 'rgba(255,255,255,0.06)';
      c.fillRect(2, 2, 28, 28); c.fillRect(34, 2, 28, 28);
      c.fillRect(2, 34, 28, 28); c.fillRect(34, 34, 28, 28);
      c.fillStyle = 'rgba(0,0,0,0.45)';
      c.fillRect(0, 31, W, 2); c.fillRect(31, 0, 2, H);
      c.fillStyle = '#fff6d8';                        /* fluorescente */
      c.fillRect(8, 14, 16, 4); c.fillRect(40, 46, 16, 4);
      c.fillStyle = 'rgba(255,246,216,0.25)';
      c.fillRect(6, 12, 20, 8); c.fillRect(38, 44, 20, 8);
      noiseOver(c, W, H, 90, 0.18);
    });
  }
}

/* buffer de baja resolucion donde se pintan suelo y techo */
const fbuf = { cnv: null, ictx: null, img: null, data: null, w: 0, h: 0 };
function buildFloorBuffer() {
  /* el divisor crece en pantallas muy grandes para mantener el coste plano */
  const div = Math.max(2 * view.dpr, Math.sqrt(view.w * view.v3 / 350000));
  const w = Math.max(1, Math.ceil(view.w / div));
  const h = Math.max(1, Math.ceil(view.v3 / div));
  fbuf.cnv = makeCanvas(w, h);
  fbuf.ictx = fbuf.cnv.getContext('2d');
  fbuf.img = fbuf.ictx.createImageData(w, h);
  fbuf.data = new Uint32Array(fbuf.img.data.buffer);
  fbuf.w = w; fbuf.h = h;
}
function renderFloorCeiling(horizon) {
  const W = view.w, H = view.v3;
  if (!fbuf.cnv) buildFloorBuffer();
  if (!FLOORTEX[1]) buildFloorTextures();
  const bw = fbuf.w, bh = fbuf.h, data = fbuf.data;
  const scaleY = H / bh;
  const rdx0 = P.dirX - P.planeX, rdy0 = P.dirY - P.planeY;
  const rdx1 = P.dirX + P.planeX, rdy1 = P.dirY + P.planeY;
  const dxs = (rdx1 - rdx0) / bw, dys = (rdy1 - rdy0) / bw;
  const posZ = 0.5 * H;

  for (let by = 0; by < bh; by++) {
    const off = by * bw;
    const screenY = by * scaleY + scaleY * 0.5;
    let p = screenY - horizon;
    const ceiling = p < 0;
    if (ceiling) p = -p;
    if (p < 0.75) { data.fill(FOGPIX, off, off + bw); continue; }
    const rowD = posZ / p;
    if (rowD > 40) { data.fill(FOGPIX, off, off + bw); continue; }
    const set = ceiling ? CEILTEX : FLOORTEX;
    const lvl = shadeLevel(rowD * lightK);
    const far = rowD > 6.5;                       /* filas lejanas -> mip */
    const ts = far ? MIPS : TEXS, tm = far ? MIPM : TEXM, tsh = far ? MIPSH : TEXSH;
    let fx = P.x + rowD * rdx0, fy = P.y + rowD * rdy0;
    const stepX = rowD * dxs, stepY = rowD * dys;
    let lastZ = -1, tex = null;
    for (let bx = 0; bx < bw; bx++, fx += stepX, fy += stepY) {
      const cx = fx | 0, cy = fy | 0;
      if (cx < 0 || cy < 0 || cx >= MAP_W || cy >= MAP_H) { data[off + bx] = FOGPIX; continue; }
      const z = zoneOf[cy * MAP_W + cx];
      if (z !== lastZ) { lastZ = z; const e = set[z]; tex = far ? e.mip[lvl] : e.full[lvl]; }
      data[off + bx] = tex[((((fy * ts) | 0) & tm) << tsh) + (((fx * ts) | 0) & tm)];
    }
  }
  fbuf.ictx.putImageData(fbuf.img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(fbuf.cnv, 0, 0, bw, bh, 0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
}

/* ---------------------------- LIENZO / VISTA ------------------------- */
const cv  = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
const view = { w: 0, h: 0, s: 1, dpr: 1 };
let COL_W = 2, COLS = 0, zbuf = new Float32Array(1);

const MAX_BACKING = 2400;                            // tope de pixeles reales de ancho
function resize() {
  let dpr = clamp(window.devicePixelRatio || 1, 1, 2);
  if (window.innerWidth * dpr > MAX_BACKING) dpr = MAX_BACKING / window.innerWidth;
  dpr = Math.max(1, dpr);
  cv.width  = Math.max(320, Math.floor(window.innerWidth  * dpr));
  cv.height = Math.max(240, Math.floor(window.innerHeight * dpr));
  cv.style.width  = window.innerWidth + 'px';
  cv.style.height = window.innerHeight + 'px';
  view.w = cv.width; view.h = cv.height; view.dpr = dpr;
  view.s = clamp(view.h / 800, 0.7, 2.4);              // escala de la interfaz
  view.hud = 96 * view.s;                              // alto de la barra inferior
  view.v3 = view.h - view.hud;                         // viewport 3D (encima del HUD)
  COL_W = Math.max(2, Math.round(2 * dpr));
  COLS  = Math.ceil(view.w / COL_W);
  zbuf  = new Float32Array(COLS);                       // <- Z-BUFFER 1D
  fbuf.cnv = null;
  minimapDirty = true;
}
window.addEventListener('resize', resize);

/* ------------------------------- AUDIO ------------------------------- */
const Snd = {
  ac: null, on: true,
  init() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; } } },
  gain(v, t) { const g = this.ac.createGain(); g.gain.setValueAtTime(v, this.ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, this.ac.currentTime + t); g.connect(this.ac.destination); return g; },
  tone(freq, t, type, vol, slideTo) {
    if (!this.on || !this.ac) return;
    const o = this.ac.createOscillator(); o.type = type || 'square';
    o.frequency.setValueAtTime(freq, this.ac.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), this.ac.currentTime + t);
    o.connect(this.gain(vol || 0.08, t)); o.start(); o.stop(this.ac.currentTime + t);
  },
  noise(t, vol, freq, q) {
    if (!this.on || !this.ac) return;
    const n = Math.floor(this.ac.sampleRate * t);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq || 1800, this.ac.currentTime);
    f.frequency.exponentialRampToValueAtTime(200, this.ac.currentTime + t);
    f.Q.value = q || 1;
    src.connect(f); f.connect(this.gain(vol || 0.16, t)); src.start(); src.stop(this.ac.currentTime + t);
  },
  ruler()  { this.tone(420, 0.07, 'square', 0.05, 160); },
  chalk()  { this.noise(0.12, 0.14, 2600); this.tone(300, 0.08, 'sawtooth', 0.05, 90); },
  shotgun(){ this.noise(0.34, 0.28, 1600, 2); this.tone(120, 0.22, 'sawtooth', 0.10, 40); },
  launch() { this.tone(220, 0.25, 'triangle', 0.10, 700); },
  boom()   { this.noise(0.85, 0.34, 900, 3); this.tone(70, 0.6, 'sine', 0.16, 25); },
  hit()    { this.tone(760, 0.05, 'square', 0.04, 380); },
  hurt()   { this.tone(180, 0.22, 'sawtooth', 0.10, 70); },
  die()    { this.tone(300, 0.5, 'sawtooth', 0.10, 50); this.noise(0.4, 0.12, 700); },
  pick()   { this.tone(640, 0.07, 'triangle', 0.07); setTimeout(() => this.tone(940, 0.09, 'triangle', 0.07), 60); },
  eshot()  { this.tone(240, 0.13, 'sawtooth', 0.05, 520); },
  roar()   { this.tone(150, 0.9, 'sawtooth', 0.14, 48); this.noise(0.7, 0.14, 500); },
  empty()  { this.tone(110, 0.06, 'square', 0.04); },
  step()   { this.noise(0.07, 0.035, 420, 0.7); },
  beat()   { this.tone(58, 0.16, 'sine', 0.09, 34); },
  swap()   { this.tone(520, 0.05, 'triangle', 0.05, 760); }
};

/* =====================================================================
   SPRITES PROCEDURALES
   Cada tipo se dibuja una sola vez en un canvas offscreen (cache) y luego
   se pinta en columnas verticales para poder consultar el Z-Buffer.
   ===================================================================== */
const SPR = new Map();
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function sprite(key, w, h, drawFn) {
  let s = SPR.get(key);
  if (!s) {
    s = makeCanvas(w, h);
    const c = s.getContext('2d');
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    drawFn(c, w, h);
    SPR.set(key, s);
  }
  return s;
}
function emoji(c, txt, x, y, size) {
  c.font = size + 'px ' + EMOJI;
  c.fillText(txt, x, y);
}
function ellipse(c, x, y, rx, ry, fill) {
  c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, TAU); c.fillStyle = fill; c.fill();
}
function roundRect(c, x, y, w, h, r, fill) {
  c.beginPath();
  const rr = Math.min(r, w / 2, h / 2);
  c.moveTo(x + rr, y);
  c.arcTo(x + w, y, x + w, y + h, rr);
  c.arcTo(x + w, y + h, x, y + h, rr);
  c.arcTo(x, y + h, x, y, rr);
  c.arcTo(x, y, x + w, y, rr);
  c.closePath(); c.fillStyle = fill; c.fill();
}

/* -------- figura generica de "profesor" totalmente parametrizada ------ */
function drawFigure(c, W, H, o) {
  const cx = W / 2;
  const headRatio = o.headRatio;                    // % de altura ocupada por la cabeza
  const headH  = H * headRatio;
  const headRY = headH * 0.46;
  const headRX = Math.min(W * 0.46, headRY * (o.headWide || 1.05));
  const headCY = headH * 0.5;
  const bodyTop = headH * 0.97;
  const bodyH   = H - bodyTop;
  const shW = W * (o.shoulders || 0.62);
  const torsoH = bodyH * 0.56;
  const legTop = bodyTop + torsoH;
  const skin = o.skin, skinDark = rgbStr(mul(hex2rgb(o.skin), 0.72));

  /* sombra al suelo */
  ellipse(c, cx, H - H * 0.012, W * 0.32, H * 0.016, 'rgba(0,0,0,0.45)');

  /* piernas (con ciclo de paso) */
  const sw = o.swing || 0;                          // -1..1 fase de la zancada
  const legW = shW * 0.28, legH = H - legTop;
  const legDX = sw * legW * 0.55;
  const drawLeg = (side, dx, shorten) => {
    const lx = cx + side * shW * 0.30 - legW / 2 + dx;
    const lh = legH * (0.9 - shorten * 0.12);
    roundRect(c, lx, legTop, legW, lh, legW * 0.3, o.pants);
    roundRect(c, lx - legW * 0.12 + dx * 0.4, legTop + lh - legH * 0.02, legW * 1.25, legH * 0.13, 3, '#1a1a1e');
  };
  drawLeg(-1,  legDX, Math.max(0, sw));
  drawLeg( 1, -legDX, Math.max(0, -sw));

  /* torso */
  roundRect(c, cx - shW / 2, bodyTop, shW, torsoH, shW * 0.16, o.shirt);

  /* brazos articulados desde el hombro */
  const armW = shW * 0.20, armLen = torsoH * 0.84;
  const shoulderY = bodyTop + torsoH * 0.12;
  const drawArm = (sx, ang) => {
    c.save(); c.translate(cx + sx, shoulderY); c.rotate(ang);
    roundRect(c, -armW / 2, -armW * 0.4, armW, armLen, armW * 0.45, o.shirt);
    ellipse(c, 0, armLen - armW * 0.15, armW * 0.52, armW * 0.52, skin);
    c.restore();
  };
  if (o.attack) {                                   /* pose de ataque: brazos en alto */
    drawArm(-shW / 2 - armW * 0.15, -2.45);
    drawArm( shW / 2 + armW * 0.15,  2.45);
  } else {
    drawArm(-shW / 2 - armW * 0.15, -0.10 + sw * 0.42);
    drawArm( shW / 2 + armW * 0.15,  0.10 + sw * 0.42);
  }

  if (o.coat) {                                     // bata / chaqueta abierta
    c.fillStyle = o.coat;
    c.fillRect(cx - shW / 2, bodyTop, shW * 0.22, torsoH * 1.25);
    c.fillRect(cx + shW / 2 - shW * 0.22, bodyTop, shW * 0.22, torsoH * 1.25);
  }
  if (o.tie) {                                      // corbata
    c.fillStyle = o.tie;
    c.beginPath();
    c.moveTo(cx, bodyTop + torsoH * 0.02);
    c.lineTo(cx - shW * 0.07, bodyTop + torsoH * 0.16);
    c.lineTo(cx, bodyTop + torsoH * 0.62);
    c.lineTo(cx + shW * 0.07, bodyTop + torsoH * 0.16);
    c.closePath(); c.fill();
  }
  /* cuello */
  c.fillStyle = skinDark;
  c.fillRect(cx - headRX * 0.28, bodyTop - headH * 0.10, headRX * 0.56, headH * 0.14);

  /* cabeza */
  ellipse(c, cx, headCY, headRX, headRY, skin);
  /* orejas */
  ellipse(c, cx - headRX * 0.97, headCY + headRY * 0.05, headRX * 0.14, headRY * 0.20, skinDark);
  ellipse(c, cx + headRX * 0.97, headCY + headRY * 0.05, headRX * 0.14, headRY * 0.20, skinDark);

  /* pelo */
  if (o.hair) {
    c.fillStyle = o.hair;
    if (o.bald) {                                   // calvo: solo pelo a los lados
      c.beginPath();
      c.ellipse(cx - headRX * 0.80, headCY + headRY * 0.05, headRX * 0.26, headRY * 0.42, 0, 0, TAU);
      c.ellipse(cx + headRX * 0.80, headCY + headRY * 0.05, headRX * 0.26, headRY * 0.42, 0, 0, TAU);
      c.fill();
      c.beginPath();                                 // pelusilla en la nuca
      c.ellipse(cx, headCY + headRY * 0.62, headRX * 0.82, headRY * 0.26, 0, 0, Math.PI);
      c.fill();
    } else {
      c.beginPath();
      c.ellipse(cx, headCY - headRY * 0.36, headRX * 1.02, headRY * 0.62, 0, Math.PI, TAU);
      c.fill();
      c.fillRect(cx - headRX * 1.02, headCY - headRY * 0.42, headRX * 2.04, headRY * 0.22);
      if (o.longHair) {
        c.fillRect(cx - headRX * 1.02, headCY - headRY * 0.4, headRX * 0.28, headRY * 1.1);
        c.fillRect(cx + headRX * 0.74, headCY - headRY * 0.4, headRX * 0.28, headRY * 1.1);
      }
    }
  }
  /* cejas */
  const eyeY = headCY + headRY * 0.06, eyeDX = headRX * 0.40, eyeR = headRX * 0.20;
  c.fillStyle = o.hair || '#2b2b2b';
  c.fillRect(cx - eyeDX - eyeR, eyeY - eyeR * (o.angry ? 1.5 : 1.9), eyeR * 2, eyeR * 0.5);
  c.fillRect(cx + eyeDX - eyeR, eyeY - eyeR * (o.angry ? 1.5 : 1.9), eyeR * 2, eyeR * 0.5);

  /* ojos */
  ellipse(c, cx - eyeDX, eyeY, eyeR, eyeR * 0.82, '#f7f7f2');
  ellipse(c, cx + eyeDX, eyeY, eyeR, eyeR * 0.82, '#f7f7f2');
  ellipse(c, cx - eyeDX + eyeR * 0.15, eyeY, eyeR * 0.42, eyeR * 0.42, '#141414');
  ellipse(c, cx + eyeDX + eyeR * 0.15, eyeY, eyeR * 0.42, eyeR * 0.42, '#141414');

  /* GAFAS: strokeRect para que se vean sin lugar a dudas */
  if (o.glasses) {
    c.strokeStyle = o.glassCol || '#141414';
    c.lineWidth = Math.max(2, headRX * 0.09);
    c.fillStyle = 'rgba(190,225,255,0.30)';
    const gw = eyeR * 2.5, gh = eyeR * 2.1;
    c.fillRect(cx - eyeDX - gw / 2, eyeY - gh / 2, gw, gh);
    c.fillRect(cx + eyeDX - gw / 2, eyeY - gh / 2, gw, gh);
    c.strokeRect(cx - eyeDX - gw / 2, eyeY - gh / 2, gw, gh);
    c.strokeRect(cx + eyeDX - gw / 2, eyeY - gh / 2, gw, gh);
    c.beginPath();                                   // puente
    c.moveTo(cx - eyeDX + gw / 2, eyeY);
    c.lineTo(cx + eyeDX - gw / 2, eyeY);
    c.moveTo(cx - eyeDX - gw / 2, eyeY);             // patillas
    c.lineTo(cx - headRX, eyeY - gh * 0.2);
    c.moveTo(cx + eyeDX + gw / 2, eyeY);
    c.lineTo(cx + headRX, eyeY - gh * 0.2);
    c.stroke();
  }
  /* nariz y boca */
  ellipse(c, cx, eyeY + headRY * 0.26, headRX * 0.11, headRY * 0.10, skinDark);
  c.fillStyle = '#5a1f1f';
  if (o.shout) {
    ellipse(c, cx, eyeY + headRY * 0.55, headRX * 0.24, headRY * 0.20, '#5a1f1f');
  } else {
    c.fillRect(cx - headRX * 0.26, eyeY + headRY * 0.52, headRX * 0.52, headRY * 0.07);
  }
  /* arrugas de persona mayor */
  if (o.old) {
    c.strokeStyle = 'rgba(0,0,0,0.25)';
    c.lineWidth = Math.max(1, headRX * 0.045);
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.moveTo(cx - headRX * 0.62, headCY - headRY * (0.55 - i * 0.11));
      c.lineTo(cx + headRX * 0.62, headCY - headRY * (0.55 - i * 0.11));
      c.stroke();
    }
  }
  /* emoji identificador */
  if (o.emoji) emoji(c, o.emoji, cx, bodyTop + torsoH * 0.38, Math.min(W * 0.42, torsoH * 0.62));
  if (o.headEmoji) emoji(c, o.headEmoji, cx, headH * 0.10, headRX * 0.9);
}

/* ------------------------- cadaver generico -------------------------- */
function drawCorpse(c, W, H, o) {
  ellipse(c, W * 0.5, H * 0.72, W * 0.46, H * 0.24, 'rgba(90,10,14,0.75)');
  ellipse(c, W * 0.55, H * 0.55, W * 0.30, H * 0.22, o.shirt);
  ellipse(c, W * 0.26, H * 0.52, W * 0.16, H * 0.19, o.skin);
  c.fillStyle = '#141414';
  c.lineWidth = Math.max(2, W * 0.02);
  c.strokeStyle = '#141414';
  const ex = W * 0.22, ey = H * 0.48, r = W * 0.045;
  c.beginPath();
  c.moveTo(ex - r, ey - r); c.lineTo(ex + r, ey + r);
  c.moveTo(ex + r, ey - r); c.lineTo(ex - r, ey + r);
  c.moveTo(ex - r + W * 0.11, ey - r); c.lineTo(ex + r + W * 0.11, ey + r);
  c.moveTo(ex + r + W * 0.11, ey - r); c.lineTo(ex - r + W * 0.11, ey + r);
  c.stroke();
  if (o.emoji) emoji(c, o.emoji, W * 0.72, H * 0.45, W * 0.20);
}

/* ------------------- sprites de cada tipo (cache) -------------------- */
const SWING = [0, 1, 0, -1];                 /* ciclo de paso de 4 fotogramas */
function spriteOf(def, state, frame) {
  frame = frame || 0;
  const key = def.id + '|' + state + '|' + frame;
  const t = def.tex || TEX;
  return sprite(key, t.w, t.h, (c, W, H) => {
    if (state === 'dead') { drawCorpse(c, W, H, { shirt:def.look.shirt, skin:def.look.skin, emoji:def.look.emoji }); return; }
    const o = Object.assign({}, def.look);
    o.swing = state === 'walk' ? SWING[frame & 3] : 0;
    if (state === 'attack') { o.shout = true; o.angry = true; o.attack = true; }
    drawFigure(c, W, H, o);
    if (def.id === 'J') {                     // Jorge: baston de mando
      c.strokeStyle = '#3a2a18'; c.lineWidth = W * 0.035;
      c.beginPath(); c.moveTo(W * 0.86, H * 0.42); c.lineTo(W * 0.90, H * 0.99); c.stroke();
    }
    if (state === 'attack' && def.boss) {     // aura de ataque
      c.globalCompositeOperation = 'source-atop';
      c.fillStyle = 'rgba(255,90,50,0.18)';
      c.fillRect(0, 0, W, H);
      c.globalCompositeOperation = 'source-over';
    }
  });
}

/* ------------------------- colisiones (circulo vs AABB) -------------- */
function hitsWall(x, y, r) {
  const x0 = Math.floor(x - r), x1 = Math.floor(x + r);
  const y0 = Math.floor(y - r), y1 = Math.floor(y + r);
  for (let cy = y0; cy <= y1; cy++) {
    for (let cx = x0; cx <= x1; cx++) {
      if (!isWall(cx, cy)) continue;
      const nx = clamp(x, cx, cx + 1), ny = clamp(y, cy, cy + 1);
      if (dist2(x, y, nx, ny) < r * r) return true;
    }
  }
  return false;
}
/* movimiento con deslizamiento: se resuelve cada eje por separado */
function moveEnt(e, dx, dy) {
  if (dx !== 0 && !hitsWall(e.x + dx, e.y, e.radius)) e.x += dx;
  if (dy !== 0 && !hitsWall(e.x, e.y + dy, e.radius)) e.y += dy;
}
/* linea de vision por muestreo de la rejilla */
function hasLOS(x1, y1, x2, y2, maxD) {
  const dx = x2 - x1, dy = y2 - y1;
  const d = Math.hypot(dx, dy);
  if (maxD && d > maxD) return false;
  const steps = Math.ceil(d / 0.2);
  const sx = dx / steps, sy = dy / steps;
  let x = x1, y = y1;
  for (let i = 0; i < steps; i++) {
    x += sx; y += sy;
    if (isWall(Math.floor(x), Math.floor(y))) return false;
  }
  return true;
}
/* ------------- busqueda de camino: campo de flujo BFS al jugador ------
   Se recalcula unas pocas veces por segundo sobre la rejilla (40x34), y
   los profesores lo siguen cuando te pierden de vista.                   */
let flowDist = null, flowT = 0;
const DIRX = [1, -1, 0, 0, 1, 1, -1, -1];
const DIRY = [0, 0, 1, -1, 1, -1, 1, -1];
function buildFlow() {
  if (!flowDist) flowDist = new Uint16Array(MAP_W * MAP_H);
  flowDist.fill(65535);
  const sx = P.x | 0, sy = P.y | 0;
  if (sx < 0 || sy < 0 || sx >= MAP_W || sy >= MAP_H || isWall(sx, sy)) return;
  const q = flowQueue || (flowQueue = new Int32Array(MAP_W * MAP_H));
  let qh = 0, qt = 0;
  const si = sy * MAP_W + sx;
  flowDist[si] = 0; q[qt++] = si;
  while (qh < qt) {
    const i = q[qh++], x = i % MAP_W, y = (i / MAP_W) | 0, d = flowDist[i] + 1;
    for (let k = 0; k < 4; k++) {
      const nx = x + DIRX[k], ny = y + DIRY[k];
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      const ni = ny * MAP_W + nx;
      if (flowDist[ni] <= d || grid[ni]) continue;
      flowDist[ni] = d; q[qt++] = ni;
    }
  }
}
let flowQueue = null;
/* direccion hacia la casilla vecina que mas acerca al jugador */
function flowAngle(e) {
  if (!flowDist) return null;
  const cx = e.x | 0, cy = e.y | 0;
  if (cx < 0 || cy < 0 || cx >= MAP_W || cy >= MAP_H) return null;
  let best = flowDist[cy * MAP_W + cx], bx = -1, by = -1;
  if (best === 65535) return null;
  for (let k = 0; k < 8; k++) {
    const nx = cx + DIRX[k], ny = cy + DIRY[k];
    if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
    if (isWall(nx, ny)) continue;
    if (k >= 4 && (isWall(nx, cy) || isWall(cx, ny))) continue;   /* diagonal cerrada */
    const d = flowDist[ny * MAP_W + nx];
    if (d < best) { best = d; bx = nx; by = ny; }
  }
  if (bx < 0) return null;
  return Math.atan2(by + 0.5 - e.y, bx + 0.5 - e.x);
}

/* distancia a la pared en una direccion (DDA compacto) */
function rayWall(ox, oy, dx, dy, maxD) {
  let mapX = Math.floor(ox), mapY = Math.floor(oy);
  const ddx = Math.abs(dx) < 1e-9 ? 1e9 : Math.abs(1 / dx);
  const ddy = Math.abs(dy) < 1e-9 ? 1e9 : Math.abs(1 / dy);
  let stepX, stepY, sdx, sdy;
  if (dx < 0) { stepX = -1; sdx = (ox - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - ox) * ddx; }
  if (dy < 0) { stepY = -1; sdy = (oy - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - oy) * ddy; }
  for (let i = 0; i < 200; i++) {
    let side;
    if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; } else { sdy += ddy; mapY += stepY; side = 1; }
    if (isWall(mapX, mapY)) {
      const d = side === 0 ? sdx - ddx : sdy - ddy;
      return d;
    }
    if ((side === 0 ? sdx : sdy) > maxD) break;
  }
  return maxD;
}

function updateDir() {
  P.dirX = Math.cos(P.ang); P.dirY = Math.sin(P.ang);

  P.planeX = -P.dirY * planeLen; P.planeY = P.dirX * planeLen;
}

/* --------------------------- dano al jugador -------------------------- */
const hurtMarks = [];
function hurtPlayer(amount, sx, sy) {
  if (P.dead || state !== 'play') return;
  if (sx !== undefined) {
    hurtMarks.push({ ang: Math.atan2(sy - P.y, sx - P.x), t: 1.2 });
    if (hurtMarks.length > 6) hurtMarks.shift();
  }
  amount *= DIFFS[diff].dmg;
  if (P.armor > 0) {
    const abs = Math.min(P.armor, amount * 0.5);
    P.armor -= abs; amount -= abs;
  }
  P.hp -= amount;
  P.pain = Math.min(1, P.pain + amount / 55);
  P.shake = Math.min(16, P.shake + amount * 0.35);
  Snd.hurt();
  if (P.hp <= 0) {
    P.hp = 0; P.dead = true; state = 'dead';
    endStats = { win:false, time:gameTime, kills:P.kills, total:killTotal, score:P.score };
    Snd.die();
    if (document.pointerLockElement) document.exitPointerLock();
  }
}
/* --------------------------- dano a enemigos -------------------------- */
function hurtEnemy(e, dmg, kx, ky) {
  if (!e.alive) return;
  P.hitMark = 0.22;
  e.hp -= dmg;
  e.flash = 0.16;
  e.state = 'chase';
  e.activated = true;
  if (kx !== undefined && !e.boss) { e.knockX = kx; e.knockY = ky; e.knock = 0.12; }
  spawnFX('blood', e.x, e.y, e.boss ? 0.55 : 0.36, 0.3);
  Snd.hit();
  if (e.hp <= 0) {
    e.alive = false; e.hp = 0; e.deadT = 0;
    P.killMark = 0.5;
    P.kills++; P.score += e.def.score;
    Snd.die();
    if (e.def.drop && Math.random() < e.def.drop) spawnItem('a', e.x, e.y);
    if (e.boss) {
      addMsg('\u{1F480} ' + e.def.name + ' HA SIDO EXPULSADO', '#ff5c5c');
      spawnFX('boom', e.x, e.y, 2.4, 0.7);

      spawnItem('h', e.x + 0.4, e.y);

    }
  }
}

  if (k === 'enter' && (state === 'menu' || state === 'pause')) startGame();
}, { passive: false });

function selectWeapon(i) {
  if (state !== 'play' || i === P.weapon || i < 0 || i > 3) return;
  P.nextW = i; P.switching = 0.001; Snd.swap();
}
function ammoFor(w) {
  const def = WEAPONS[w];
  if (!def.ammo) return Infinity;
  return def.ammo === 'ammo' ? P.ammo : P.exams;
}

/* =====================================================================
   DISPARO
   ===================================================================== */
function fire() {
  const w = WEAPONS[P.weapon];
  if (P.cool > 0 || P.switching > 0) return;
  if (ammoFor(P.weapon) < w.cost) {
    P.cool = 0.35; Snd.empty();
    addMsg('SIN MUNICION', '#ff6b6b');
    return;
  }
  P.cool = w.rate;
  P.kick = w.kick;
  P.flash = 0.07;
  if (w.ammo === 'ammo') P.ammo -= w.cost;
  else if (w.ammo === 'exams') P.exams -= w.cost;

  if (w.proj) {                                   /* --- EXAMEN SORPRESA --- */
    spawnProj({
      x: P.x + P.dirX * 0.4, y: P.y + P.dirY * 0.4,
      vx: P.dirX * 4.2, vy: P.dirY * 4.2,
      dmg: 0, life: 9, r: 0.22, spr:'exam', owner:'player', exam:true,
      fuse: 2.0, scaleX:0.42, scaleY:0.42
    });
    Snd.launch();
    addMsg('\u{1F4DD} EXAMEN SORPRESA LANZADO', '#fff0a8');
    return;
  }
  for (let i = 0; i < w.pellets; i++) {           /* --- HITSCANS --- */
    const a = P.ang + (w.pellets > 1 ? rnd(-w.spread, w.spread) : rnd(-w.spread, w.spread));
    hitscan(a, w);
  }
  if (P.weapon === 0) Snd.ruler();
  else if (P.weapon === 1) Snd.chalk();
  else Snd.shotgun();
}

function hitscan(ang, w) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const wallD = rayWall(P.x, P.y, dx, dy, w.range);
  let best = null, bestT = wallD;
  for (const e of enemies) {
    if (!e.alive) continue;
    const ex = e.x - P.x, ey = e.y - P.y;
    const t = ex * dx + ey * dy;                   // proyeccion sobre el rayo
    if (t <= 0.05 || t > bestT) continue;
    const px = ex - dx * t, py = ey - dy * t;      // distancia perpendicular
    const rr = e.radius * (e.boss ? 1.15 : 1.0);
    if (px * px + py * py > rr * rr) continue;
    best = e; bestT = t;
  }
  const hx = P.x + dx * bestT, hy = P.y + dy * bestT;
  if (best) {
    let dmg = w.dmg;
    if (w.pellets > 1) dmg *= clamp(1 - bestT / (w.range * 0.8), 0.3, 1);   // dispersion
    hurtEnemy(best, dmg, dx, dy);
  } else {
    spawnFX('spark', hx - dx * 0.05, hy - dy * 0.05, 0.35, 0.22);
  }
}

/* --------------------------- explosion del examen --------------------- */
function explode(x, y, radius, dmgEnemy, dmgBoss) {
  spawnFX('boom', x, y, radius, 0.75);
  Snd.boom();
  P.flash = Math.max(P.flash, 0.18);
  for (const e of enemies) {
    if (!e.alive) continue;
    const d = dist(x, y, e.x, e.y);
    if (d > radius) continue;
    if (!hasLOS(x, y, e.x, e.y)) continue;
    const f = clamp(1 - d / radius, 0.25, 1);
    hurtEnemy(e, (e.boss ? dmgBoss : dmgEnemy) * f);
  }
  const dp = dist(x, y, P.x, P.y);
  if (dp < radius * 0.75 && hasLOS(x, y, P.x, P.y)) {
    hurtPlayer(clamp(1 - dp / (radius * 0.75), 0, 1) * 32, x, y);
  }
}

/* =====================================================================
   ACTUALIZACION DEL JUGADOR
   ===================================================================== */
function updatePlayer(dt) {
  /* cambio de arma con animacion de bajada/subida */
  if (P.switching > 0) {
    P.switching += dt * 4.5;
    if (P.switching >= 1 && P.nextW >= 0) { P.weapon = P.nextW; P.nextW = -1; }
    if (P.switching >= 2) P.switching = 0;
  }
  let mx = 0, my = 0;
  const fw = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
  const st = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
  if (keys['arrowleft'])  { P.ang -= 2.4 * dt; updateDir(); }
  if (keys['arrowright']) { P.ang += 2.4 * dt; updateDir(); }
  const plen = Math.hypot(P.planeX, P.planeY) || 1;
  const rx = P.planeX / plen, ry = P.planeY / plen;
  mx = P.dirX * fw + rx * st;
  my = P.dirY * fw + ry * st;
  const len = Math.hypot(mx, my);
  const running = keys['shift'] || keys['shiftleft'];
  if (len > 0) {
    const sp = P.speed * (running ? P.run : 1) * dt;
    moveEnt(P, (mx / len) * sp, (my / len) * sp);
    P.bobT += dt * (running ? 13 : 9);
    P.bob = Math.sin(P.bobT) * (running ? 1 : 0.65);
  } else {
    P.bob *= Math.max(0, 1 - dt * 6);
  }
  if (mouseDown || keys[' ']) fire();

  /* pasos y aviso de zona */
  const stepPh = Math.sin(P.bobT);
  if (len > 0 && stepPh < 0 && P.lastStep >= 0) Snd.step();
  P.lastStep = len > 0 ? stepPh : 0;
  const z = zoneAt(P.x | 0, P.y | 0);
  if (z !== P.zone) {
    P.zone = z;
    addMsg('\u21E8 ' + ZONES[z].name, '#9fd0ff');
  }
  /* latido cuando la salud es critica */
  if (P.hp < 32 && P.hp > 0) {
    P.beat -= dt;
    if (P.beat <= 0) { P.beat = clamp(P.hp / 30, 0.35, 1) * 1.1; Snd.beat(); }
  }

  P.cool = Math.max(0, P.cool - dt);
  P.hitMark = Math.max(0, P.hitMark - dt);
  P.killMark = Math.max(0, P.killMark - dt);
  P.kick = Math.max(0, P.kick - dt * 60);
  P.flash = Math.max(0, P.flash - dt);
  P.pain = Math.max(0, P.pain - dt * 1.1);
  P.shake = Math.max(0, P.shake - dt * 30);
  P.pitch *= (1 - dt * 0.7);                       // la vista vuelve al centro poco a poco

  /* recogida de objetos */
  for (const it of items) {
    if (it.taken) continue;
    it.t += dt * 2.5;
    if (dist2(it.x, it.y, P.x, P.y) > 0.35) continue;
    let ok = false;
    if (it.kind === 'a' && P.ammo < P.maxAmmo) { P.ammo = Math.min(P.maxAmmo, P.ammo + 25); ok = true; }
    if (it.kind === 'h' && P.hp < 100)        { P.hp = Math.min(100, P.hp + 25); ok = true; }
    if (it.kind === 'r' && P.armor < 100)     { P.armor = Math.min(100, P.armor + 25); ok = true; }
    if (it.kind === 'x' && P.exams < P.maxExams) { P.exams++; ok = true; }
    if (ok) { it.taken = true; P.score += 25; Snd.pick(); addMsg(ITEMS[it.kind].msg, '#9fe8a0'); }
  }
}

/* =====================================================================
   IA DE LOS PROFESORES  (patrulla / persecucion con linea de vision)
   ===================================================================== */
function enemyShoot(e, ang, speed, dmg, spr, bounces) {
  spawnProj({
    x: e.x + Math.cos(ang) * (e.radius + 0.22),
    y: e.y + Math.sin(ang) * (e.radius + 0.22),
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    dmg: dmg, life: 6, r: 0.16, spr: spr, owner: 'enemy',
    bounces: bounces || 0, scaleX: 0.30, scaleY: 0.30
  });
  Snd.eshot();
}
function freeSpotNear(x, y, r) {
  for (let i = 0; i < 24; i++) {
    const a = rnd(0, TAU), d = rnd(1.2, r);
    const nx = x + Math.cos(a) * d, ny = y + Math.sin(a) * d;
    if (!hitsWall(nx, ny, 0.35)) return { x: nx, y: ny };
  }
  return null;
}

function updateEnemies(dt) {
  bossHUD = null;
  let bestBossD = 1e9;
  flowT -= dt;
  if (flowT <= 0) { flowT = 0.3; buildFlow(); }
  for (const e of enemies) {
    if (!e.alive) { e.deadT += dt; continue; }
    const d = dist(e.x, e.y, P.x, P.y);
    const def = e.def;
    e.flash = Math.max(0, e.flash - dt);
    e.anim = Math.max(0, e.anim - dt);
    e.bob += dt * (e.state === 'chase' ? 7 : 3);

    /* linea de vision con refresco escalonado (barato) */
    e.losT -= dt;
    if (e.losT <= 0) {
      e.losT = 0.18 + Math.random() * 0.12;
      e.los = d < def.sight && hasLOS(e.x, e.y, P.x, P.y);
      if (e.los) {
        e.state = 'chase';
        if (!e.activated) {
          e.activated = true;
          if (e.boss) {
            Snd.roar();
            addMsg('⚠ ' + def.name + ' TE HA VISTO', '#ff6b6b');
            bossIntro = { name: def.name, t: 2.4 };
          }
        }
      } else if (e.state === 'chase' && d > def.sight * 1.4) {
        e.state = 'patrol';
      }
    }
    if (e.knock > 0) {
      e.knock -= dt;
      moveEnt(e, e.knockX * dt * 3.2, e.knockY * dt * 3.2);
    }

    /* ------------------------- barra de jefe --------------------------- */
    if (e.boss && e.activated && d < bestBossD) { bestBossD = d; bossHUD = e; }

    const toA = Math.atan2(P.y - e.y, P.x - e.x);
    let speed = def.speed;

    if (e.state === 'chase') {
      /* --------------------- comportamiento por tipo ------------------- */
      if (e.boss && def.attack === 'dash') {           /* ARTURO: embestida */
        e.dashT -= dt;
        if (e.dashing > 0) {
          e.dashing -= dt; speed = def.speed * def.dashMul;
          if (Math.random() < dt * 20) spawnFX('dust', e.x, e.y, 0.5, 0.25);
        } else if (e.dashT <= 0) {
          e.dashT = def.dashEvery; e.dashing = def.dashTime;
          e.anim = def.dashTime; Snd.tone(90, 0.3, 'sawtooth', 0.1, 220);
        }
      }
      if (def.kind === 'ranged' || e.boss) {
        e.cd -= dt;
        if (e.los && e.cd <= 0) {
          if (def.attack === 'burst') {               /* ROBERTO: rafaga x3 */
            e.burstLeft = def.burst; e.burstT = 0; e.cd = def.cd; e.anim = 0.5;
          } else if (def.attack === 'bounce') {       /* DAVID: rebotes */
            enemyShoot(e, toA + rnd(-0.12, 0.12), def.projSpeed, def.dmg, 'david', def.bounces);
            e.cd = def.cd; e.anim = 0.35;
          } else if (def.attack === 'hell') {         /* JORGE: bullet hell */
            const base = toA + rnd(-0.2, 0.2);
            for (let i = 0; i < 8; i++) enemyShoot(e, base + i * TAU / 8, def.projSpeed, def.dmg, 'jorge', 0);
            e.cd = def.cd; e.anim = 0.6; Snd.roar();
          } else if (!e.boss) {                       /* MATEMATICAS */
            enemyShoot(e, toA + rnd(-0.06, 0.06), def.projSpeed, def.dmg, 'math', 0);
            e.cd = def.cd; e.anim = 0.3;
          } else {
            e.cd = def.cd;
          }
        }
      }
      if (e.burstLeft > 0) {                          /* disparos de la rafaga */
        e.burstT -= dt;
        if (e.burstT <= 0) {
          enemyShoot(e, toA, def.projSpeed, def.dmg, 'roberto', 0);
          e.burstLeft--; e.burstT = def.burstGap; e.anim = 0.25;
        }
      }
      if (e.boss && def.summonEvery) {                /* JORGE: invocaciones */
        e.summonT -= dt;
        if (e.summonT <= 0) {
          e.summonT = def.summonEvery;
          const alive = enemies.filter(o => o.alive && o.summoned).length;
          if (alive < def.summonMax) {
            let n = 0;
            for (let i = 0; i < 2; i++) {
              const s = freeSpotNear(e.x, e.y, 3.2);
              if (!s) continue;
              const m = spawnEnemy(ENEMIES.E, s.x, s.y);
              m.summoned = true; m.state = 'chase'; m.activated = true;
              killTotal++;                              /* el marcador crece con los refuerzos */
              spawnFX('summon', s.x, s.y, 1.1, 0.6); n++;
            }
            if (n) { addMsg('\u{1F4E2} JORGE LLAMA A LOS DE ED. FISICA', '#ff9f5c'); Snd.roar(); }
          }
        }
      }

      /* ------------------------ desplazamiento ------------------------- */
      let mvA = toA, move = true;
      if (!e.los) {                                   /* sin verte: sigue el pasillo */
        const fa = flowAngle(e);
        if (fa !== null) mvA = fa;
      }
      if (e.los && def.kind === 'ranged' && !e.boss) {/* mantiene la distancia */
        if (d < def.keepMin) mvA = toA + Math.PI;
        else if (d < def.keepMax) { mvA = toA + Math.PI / 2 * (e.bob % 2 < 1 ? 1 : -1); move = d > def.keepMin * 1.1; }
      } else if (e.los && def.attack === 'hell' && d < 3.2) {
        mvA = toA + Math.PI;                          /* Jorge no se pega */
      } else if (d < e.radius + P.radius + 0.05) {
        move = false;
      }
      if (move) {
        const sp = speed * dt;
        moveEnt(e, Math.cos(mvA) * sp, Math.sin(mvA) * sp);
        e.walk += dt * speed * 2.4;
      }
      /* ------------------------- cuerpo a cuerpo ----------------------- */
      if (def.kind === 'melee' || (e.boss && def.attack === 'dash')) {
        e.cd -= dt;
        if (d < e.radius + P.radius + 0.35 && e.cd <= 0) {
          e.cd = def.cd || 1;
          hurtPlayer(def.dmg * (e.dashing > 0 ? 1.6 : 1), e.x, e.y);
          e.anim = 0.3;
        }
      } else if (e.boss && d < e.radius + P.radius + 0.3) {
        e.cd2 = (e.cd2 || 0) - dt;
        if (e.cd2 <= 0) { e.cd2 = 1.1; hurtPlayer(def.dmg * 0.6, e.x, e.y); }
      }
    } else {
      /* ---------------------------- PATRULLA --------------------------- */
      e.wander -= dt;
      if (e.wander <= 0 || dist2(e.x, e.y, e.tx, e.ty) < 0.25) {
        e.wander = rnd(2.5, 5);
        const a = rnd(0, TAU), r = rnd(2, 6);
        const nx = e.x + Math.cos(a) * r, ny = e.y + Math.sin(a) * r;
        if (!hitsWall(nx, ny, e.radius) && hasLOS(e.x, e.y, nx, ny)) { e.tx = nx; e.ty = ny; }
      }
      const a = Math.atan2(e.ty - e.y, e.tx - e.x);
      const sp = def.speed * 0.45 * dt;
      moveEnt(e, Math.cos(a) * sp, Math.sin(a) * sp);
      e.walk += dt * def.speed * 1.3;
    }
  }
  /* separacion suave para que no se apilen */
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (!a.alive) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (!b.alive) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const rr = a.radius + b.radius;
      const d2 = dx * dx + dy * dy;
      if (d2 > rr * rr || d2 < 1e-6) continue;
      const d = Math.sqrt(d2), push = (rr - d) * 0.5;
      const ux = dx / d, uy = dy / d;
      if (!a.boss) moveEnt(a, -ux * push, -uy * push);
      if (!b.boss) moveEnt(b,  ux * push,  uy * push);
    }
  }
}

/* =====================================================================
   PROYECTILES Y EFECTOS
   ===================================================================== */
function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt;
    p.spin += dt * 6;
    if (p.exam) {
      p.fuse -= dt;
      if (p.fuse <= 0) { explode(p.x, p.y, 5.5, 500, 260); projectiles.splice(i, 1); continue; }
    }
    if (p.life <= 0) { projectiles.splice(i, 1); continue; }

    const steps = Math.max(1, Math.ceil(Math.hypot(p.vx, p.vy) * dt / 0.12));
    let dead = false;
    for (let s = 0; s < steps && !dead; s++) {
      const nx = p.x + p.vx * dt / steps, ny = p.y + p.vy * dt / steps;
      /* colision con paredes (rebote para David) */
      const hitX = hitsWall(nx, p.y, p.r), hitY = hitsWall(p.x, ny, p.r);
      if (hitX || hitY) {
        if (p.exam) { explode(p.x, p.y, 5.5, 500, 260); dead = true; break; }
        if (p.bounces > 0) {
          if (hitX) p.vx = -p.vx;
          if (hitY) p.vy = -p.vy;
          if (!hitX && !hitY) { p.vx = -p.vx; p.vy = -p.vy; }
          p.bounces--;
          spawnFX('spark', p.x, p.y, 0.3, 0.18);
          Snd.tone(520, 0.06, 'square', 0.05, 300);
          continue;
        }
        spawnFX('spark', p.x, p.y, 0.3, 0.2);
        dead = true; break;
      }
      p.x = nx; p.y = ny;
      /* impacto contra el jugador */
      if (p.owner === 'enemy' && dist2(p.x, p.y, P.x, P.y) < 0.13) {
        hurtPlayer(p.dmg, p.x, p.y); spawnFX('spark', p.x, p.y, 0.4, 0.2); dead = true; break;
      }
      /* el examen del jugador estalla al tocar a un profesor */
      if (p.owner === 'player') {
        for (const e of enemies) {
          if (!e.alive) continue;
          if (dist2(p.x, p.y, e.x, e.y) < (e.radius + p.r) * (e.radius + p.r)) {
            explode(p.x, p.y, 5.5, 500, 260); dead = true; break;
          }
        }
      }
    }
    if (dead) projectiles.splice(i, 1);
  }
}
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const f = effects[i];
    f.t += dt;
    if (f.t >= f.life) effects.splice(i, 1);
  }
  for (let i = msgs.length - 1; i >= 0; i--) {
    msgs[i].t -= dt;
    if (msgs[i].t <= 0) msgs.splice(i, 1);
  }
  if (bossIntro) { bossIntro.t -= dt; if (bossIntro.t <= 0) bossIntro = null; }
  for (let i = hurtMarks.length - 1; i >= 0; i--) {
    hurtMarks[i].t -= dt * 1.4;
    if (hurtMarks[i].t <= 0) hurtMarks.splice(i, 1);
  }
}

/* =====================================================================
   RENDER 1: SUELO, TECHO Y PAREDES  (raycasting DDA)
   ===================================================================== */
let lightK = 1;                                   /* 1 normal, <1 cuando algo ilumina */
function renderWorld() {
  const W = view.w, H = view.v3;                    /* el mundo 3D vive sobre el HUD */
  const horizon = H * 0.5 + P.pitch;
  lightK = P.flash > 0 ? clamp(1 - P.flash * 5, 0.35, 1) : 1;

  /* suelo y techo texturizados por pixel */
  renderFloorCeiling(horizon);

  /* ------------------------------- DDA ------------------------------- */
  for (let col = 0; col < COLS; col++) {
    const sx = col * COL_W;
    const cameraX = 2 * (sx + COL_W * 0.5) / W - 1;
    const rdx = P.dirX + P.planeX * cameraX;
    const rdy = P.dirY + P.planeY * cameraX;

    let mapX = Math.floor(P.x), mapY = Math.floor(P.y);
    const ddx = Math.abs(rdx) < 1e-9 ? 1e9 : Math.abs(1 / rdx);
    const ddy = Math.abs(rdy) < 1e-9 ? 1e9 : Math.abs(1 / rdy);
    let stepX, stepY, sdx, sdy;
    if (rdx < 0) { stepX = -1; sdx = (P.x - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - P.x) * ddx; }
    if (rdy < 0) { stepY = -1; sdy = (P.y - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - P.y) * ddy; }

    let side = 0, type = 0, guard = 0;
    while (guard++ < 256) {
      if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; }
      else           { sdy += ddy; mapY += stepY; side = 1; }
      type = cell(mapX, mapY);
      if (type) break;
    }
    const perp = Math.max(0.02, side === 0 ? sdx - ddx : sdy - ddy);
    zbuf[col] = perp;                                   /* <-- Z-BUFFER 1D */
    if (!type) continue;

    let wallX = side === 0 ? P.y + perp * rdy : P.x + perp * rdx;
    wallX -= Math.floor(wallX);

    const lineH = H / perp;
    const top = horizon - lineH * 0.5;
    const y0 = Math.max(0, top), y1 = Math.min(H, top + lineH);
    if (y1 <= y0) continue;

    const z = ZONES[type] || ZONES[1];
    const pal = PAL[type][side][fogLevel(perp * lightK)];
    ctx.fillStyle = pal.base;
    ctx.fillRect(sx, y0, COL_W, y1 - y0);

    /* --------------------- textura procedural --------------------- */
    const rows = z.rows;
    const band = lineH / rows;
    if (band > 2.5) {
      ctx.fillStyle = pal.trim;
      const thick = Math.max(1, band * 0.09);
      for (let k = 1; k < rows; k++) {
        const yy = top + band * k;
        if (yy > 0 && yy < H) ctx.fillRect(sx, yy, COL_W, thick);
      }
      if (z.pattern === 'brick') {                       /* juntas verticales */
        ctx.fillStyle = pal.trim;
        for (let k = 0; k < rows; k++) {
          const off = (k % 2) * 0.5;
          let u = wallX - off; u -= Math.floor(u);
          if (u < 0.035 || u > 0.965) {
            const by = Math.max(0, top + band * k), be = Math.min(H, top + band * (k + 1));
            if (be > by) ctx.fillRect(sx, by, COL_W, be - by);
          }
        }
      } else if (z.pattern === 'tile') {                 /* alicatado */
        if (wallX < 0.05 || wallX > 0.95 || (wallX > 0.475 && wallX < 0.525)) {
          ctx.fillStyle = pal.trim; ctx.fillRect(sx, y0, COL_W, y1 - y0);
        }
      } else if (z.pattern === 'stripe') {               /* cortinaje */
        const s = Math.abs(Math.sin(wallX * Math.PI * 5));
        if (s < 0.35) { ctx.fillStyle = pal.wains; ctx.fillRect(sx, y0, COL_W, y1 - y0); }
      } else if (z.pattern === 'panel') {                /* paneles */
        if (wallX < 0.06 || wallX > 0.94) { ctx.fillStyle = pal.trim; ctx.fillRect(sx, y0, COL_W, y1 - y0); }
      }
      /* zocalo inferior */
      const wy = top + lineH * 0.66;
      if (wy < H) {
        ctx.fillStyle = pal.wains;
        const a = Math.max(y0, wy), b = Math.min(H, top + lineH);
        if (b > a) ctx.fillRect(sx, a, COL_W, b - a);
        ctx.fillStyle = pal.trim;
        if (wy > 0) ctx.fillRect(sx, wy, COL_W, Math.max(1, band * 0.12));
      }
    }
    /* borde superior de la pared para dar volumen */
    if (top > 0 && band > 1) {
      ctx.fillStyle = pal.trim;
      ctx.fillRect(sx, y0, COL_W, Math.max(1, lineH * 0.012));
    }
  }
}

/* =====================================================================
   RENDER 2: SPRITES (billboards) con consulta del Z-BUFFER
   ===================================================================== */
let scratch = null, sctx = null;
function tinted(tex, fog, flash) {
  if (!scratch) { scratch = makeCanvas(320, 320); sctx = scratch.getContext('2d'); }
  if (scratch.width < tex.width || scratch.height < tex.height) {
    scratch = makeCanvas(Math.max(tex.width, scratch.width), Math.max(tex.height, scratch.height));
    sctx = scratch.getContext('2d');
  }
  sctx.globalCompositeOperation = 'source-over';
  sctx.clearRect(0, 0, tex.width, tex.height);
  sctx.drawImage(tex, 0, 0);
  if (flash > 0 || fog > 0) {
    sctx.globalCompositeOperation = 'source-atop';
    if (flash > 0) { sctx.fillStyle = 'rgba(255,110,80,' + flash + ')'; sctx.fillRect(0, 0, tex.width, tex.height); }
    if (fog > 0)   { sctx.fillStyle = 'rgba(10,10,20,'  + fog   + ')'; sctx.fillRect(0, 0, tex.width, tex.height); }
    sctx.globalCompositeOperation = 'source-over';
  }
  return scratch;
}

function collectSprites() {
  const list = [];
  for (const e of enemies) {
    if (!e.alive && e.deadT > 8) continue;
    let tex, sxv, syv, alpha;
    if (e.alive) {
      tex = e.anim > 0 ? spriteOf(e.def, 'attack', 0) : spriteOf(e.def, 'walk', (e.walk | 0) & 3);
      sxv = e.scaleX; syv = e.scaleY * (1 + Math.sin(e.bob) * 0.012);
    } else {
      const k = clamp(e.deadT / 0.32, 0, 1);            /* se desploma */
      if (k < 1) {
        tex = spriteOf(e.def, 'attack', 0);
        sxv = lerp(e.scaleX, e.scaleX * 1.28, k);
        syv = lerp(e.scaleY, e.scaleY * 0.32, k * k);
      } else {
        tex = spriteOf(e.def, 'dead', 0);
        sxv = e.scaleX * 1.3; syv = e.scaleY * 0.30;
      }
      if (e.deadT > 7) alpha = clamp(1 - (e.deadT - 7), 0, 1);
    }
    list.push({
      x: e.x, y: e.y, tex: tex, sx: sxv, sy: syv, alpha: alpha,
      flash: e.flash > 0 ? 0.55 : 0, anchor: 'floor', lift: 0
    });
  }
  for (const p of projectiles) {
    list.push({
      x: p.x, y: p.y, tex: PROJ_SPR[p.spr](), sx: p.scaleX, sy: p.scaleY,
      flash: 0, anchor: 'center', lift: 0.05
    });
  }
  for (const it of items) {
    if (it.taken) continue;
    const d = ITEMS[it.kind];
    list.push({
      x: it.x, y: it.y, tex: ITEM_SPR[d.spr](), sx: d.scaleX, sy: d.scaleY,
      flash: 0, anchor: 'floor', lift: 0.06 + Math.sin(it.t) * 0.03
    });
  }
  for (const f of effects) {
    const k = f.t / f.life;
    let tex, sc = f.size;
    if (f.kind === 'boom') { tex = fxBoom(); sc = f.size * (0.5 + k * 1.5); }
    else if (f.kind === 'blood') { tex = fxBlood(); sc = f.size * (0.6 + k * 0.9); }
    else if (f.kind === 'summon') { tex = fxSummon(); sc = f.size * (0.4 + k); }
    else if (f.kind === 'dust') { tex = fxDust(); sc = f.size * (0.5 + k); }
    else { tex = fxSpark(); sc = f.size * (0.7 + k * 0.8); }
    list.push({
      x: f.x, y: f.y, tex: tex, sx: sc, sy: sc, flash: 0,
      anchor: f.kind === 'boom' || f.kind === 'summon' ? 'floor' : 'center',
      lift: f.kind === 'boom' ? 0 : 0.1, alpha: 1 - k * k
    });
  }
  return list;
}
function fxBoom() { return sprite('fx_boom', 128, 128, (c, W, H) => {
  const g = c.createRadialGradient(W/2, H/2, 2, W/2, H/2, W/2);
  g.addColorStop(0, 'rgba(255,255,220,0.95)'); g.addColorStop(0.35, 'rgba(255,170,60,0.85)');
  g.addColorStop(0.7, 'rgba(220,60,30,0.5)'); g.addColorStop(1, 'rgba(90,20,10,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  emoji(c, '\u{1F4A5}', W/2, H/2, W*0.6);
}); }
function fxBlood() { return sprite('fx_blood', 64, 64, (c, W, H) => {
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU + 0.3, r = W * (0.10 + (i % 3) * 0.09);
    ellipse(c, W/2 + Math.cos(a)*r, H/2 + Math.sin(a)*r, W*0.05, W*0.05, 'rgba(175,22,26,0.7)');
  }
  ellipse(c, W/2, H/2, W*0.10, H*0.10, 'rgba(210,40,40,0.6)');
}); }
function fxSpark() { return sprite('fx_spark', 48, 48, (c, W, H) => {
  const g = c.createRadialGradient(W/2, H/2, 1, W/2, H/2, W/2);
  g.addColorStop(0, 'rgba(255,250,220,0.9)'); g.addColorStop(0.5, 'rgba(255,190,90,0.4)');
  g.addColorStop(1, 'rgba(255,140,40,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}); }
function fxDust() { return sprite('fx_dust', 48, 48, (c, W, H) => {
  ellipse(c, W/2, H*0.7, W*0.35, H*0.18, 'rgba(190,180,160,0.35)');
}); }
function fxSummon() { return sprite('fx_summon', 96, 96, (c, W, H) => {
  const g = c.createRadialGradient(W/2, H/2, 2, W/2, H/2, W/2);
  g.addColorStop(0, 'rgba(255,120,60,0.9)'); g.addColorStop(1, 'rgba(255,60,20,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  emoji(c, '\u{1F525}', W/2, H/2, W*0.55);
}); }

function renderSprites() {
  const W = view.w, H = view.v3;
  const horizon = H * 0.5 + P.pitch;
  const list = collectSprites();
  for (const s of list) {
    s._d = dist2(s.x, s.y, P.x, P.y);
  }
  list.sort((a, b) => b._d - a._d);                    /* de lejos a cerca */

  const invDet = 1 / (P.planeX * P.dirY - P.dirX * P.planeY);
  for (const s of list) {
    const rx = s.x - P.x, ry = s.y - P.y;
    const tx = invDet * (P.dirY * rx - P.dirX * ry);
    const ty = invDet * (-P.planeY * rx + P.planeX * ry);   /* profundidad */
    if (ty < 0.12 || ty > 40) continue;

    const screenX = (W / 2) * (1 + tx / ty);
    const unit = H / ty;
    const sw = unit * s.sx, sh = unit * s.sy;
    if (sw < 1 || sh < 1) continue;
    const left = screenX - sw / 2;
    if (left > W || left + sw < 0) continue;

    let top;
    if (s.anchor === 'floor') top = horizon + unit * 0.5 - sh - unit * (s.lift || 0);
    else top = horizon - sh / 2 - unit * (s.lift || 0);

    const c0 = Math.max(0, Math.floor(left / COL_W));
    const c1 = Math.min(COLS - 1, Math.ceil((left + sw) / COL_W) - 1);
    if (c1 < c0) continue;

    /* si el Z-Buffer lo tapa por completo, ni siquiera se tinta */
    let anyVisible = false;
    for (let col = c0; col <= c1; col++) {
      if (zbuf[col] >= ty) { anyVisible = true; break; }
    }
    if (!anyVisible) continue;

    const fog = clamp((ty * lightK - 3) / 22, 0, 0.72);
    const tex = tinted(s.tex, fog, s.flash || 0);
    const tw = s.tex.width, th = s.tex.height;
    if (s.alpha !== undefined) ctx.globalAlpha = clamp(s.alpha, 0, 1);

    /* las columnas visibles contiguas se pintan de una sola pasada */
    let run = -1;
    for (let col = c0; col <= c1 + 1; col++) {
      const vis = col <= c1 && zbuf[col] >= ty;         /* <-- oclusion Z-BUFFER */
      if (vis) { if (run < 0) run = col; continue; }
      if (run < 0) continue;
      let u0 = (run * COL_W - left) / sw, u1 = (col * COL_W - left) / sw;
      u0 = clamp(u0, 0, 1); u1 = clamp(u1, 0, 1);
      if (u1 - u0 > 0.0001) {
        ctx.drawImage(tex, u0 * tw, 0, (u1 - u0) * tw, th,
                      left + u0 * sw, top, (u1 - u0) * sw, sh);
      }
      run = -1;
    }
    ctx.globalAlpha = 1;
  }
}

/* =====================================================================

function renderWeapon() {

    ctx.save(); ctx.translate(96 * s, -78 * s); ctx.rotate(-0.5 + (flash ? 0.5 : 0));
    roundRect(ctx, -22 * s, -190 * s, 44 * s, 260 * s, 6 * s, '#e9c96a');
    ctx.fillStyle = '#c9a63f'; ctx.fillRect(-22 * s, -190 * s, 44 * s, 8 * s);
    ctx.fillStyle = '#5a4718';
    for (let i = 0; i < 12; i++) {

    ctx.textAlign = 'center'; ctx.fillStyle = '#5a4718';

    roundRect(ctx, -40 * s, -152 * s, 80 * s, 124 * s, 9 * s, '#3f454e');   /* cuerpo */
    roundRect(ctx, -34 * s, -146 * s, 68 * s, 26 * s, 5 * s, '#525a66');    /* corredera */
    ctx.fillStyle = '#6d737d'; ctx.fillRect(-40 * s, -104 * s, 80 * s, 7 * s);
    ctx.strokeStyle = '#22262c'; ctx.lineWidth = 7 * s;                      /* guardamonte */
    ctx.beginPath(); ctx.arc(0, -18 * s, 22 * s, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.fillStyle = '#20242a'; ctx.fillRect(-4 * s, -34 * s, 8 * s, 22 * s); /* gatillo */
    roundRect(ctx, -16 * s, -200 * s, 32 * s, 56 * s, 5 * s, '#f7f5ee');     /* tiza */
    ctx.fillStyle = '#dcd8c8'; ctx.fillRect(-16 * s, -166 * s, 32 * s, 7 * s);
    ctx.fillStyle = '#b9b4a2'; ctx.fillRect(-16 * s, -200 * s, 32 * s, 6 * s);
    ctx.fillStyle = '#8b9099'; ctx.fillRect(-5 * s, -158 * s, 10 * s, 8 * s);/* alza */
    ctx.restore();

    roundRect(ctx, 8 * s, -196 * s, 52 * s, 176 * s, 8 * s, '#4a4038');     /* canon der */
    roundRect(ctx, -58 * s, -212 * s, 48 * s, 34 * s, 5 * s, '#7d6a52');    /* borrador */
    roundRect(ctx, 10 * s, -212 * s, 48 * s, 34 * s, 5 * s, '#7d6a52');
    ctx.fillStyle = '#d8d2c4';
    ctx.fillRect(-58 * s, -212 * s, 48 * s, 10 * s);
    ctx.fillRect(10 * s, -212 * s, 48 * s, 10 * s);
    roundRect(ctx, -46 * s, -40 * s, 92 * s, 60 * s, 10 * s, '#33291f');    /* cuerpo */
    ctx.restore();
    hand(-72 * s, -104 * s, 66 * s, 78 * s, 0.25);
    hand(72 * s, -92 * s, 66 * s, 78 * s, -0.25);
    ctx.font = (40 * s | 0) + 'px ' + EMOJI; ctx.textAlign = 'center';
    ctx.fillText('\u{1F9FD}', -34 * s, -292 * s);
    ctx.fillText('\u{1F9FD}', 34 * s, -292 * s);
    if (flash) {

        g.addColorStop(0, 'rgba(255,255,235,0.95)'); g.addColorStop(0.5, 'rgba(255,200,120,0.55)');
        g.addColorStop(1, 'rgba(255,160,60,0)');
        ctx.fillStyle = g; ctx.fillRect(ox * s - 130 * s, -420 * s, 260 * s, 240 * s);

    ctx.strokeStyle = '#cfc9b4'; ctx.lineWidth = 3 * s;

/* =====================================================================
   RENDER 4: HUD
   ===================================================================== */
function bigText(txt, x, y, size, col, align, stroke) {
  ctx.font = size + 'px ' + HUDF;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'alphabetic';
  if (stroke !== false) {
    ctx.lineWidth = Math.max(2, size * 0.09);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(txt, x, y);

  ctx.fillStyle = col;
  ctx.fillText(txt, x, y);
}
function statBlock(label, value, x, w, top, hgt, col) {
  const s = view.s;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(ctx, x, top + 8 * s, w, hgt - 16 * s, 6 * s, 'rgba(0,0,0,0.35)');
  bigText(label, x + w / 2, top + 32 * s, (19 * s) | 0, '#c9b48a');
  bigText(value, x + w / 2, top + hgt - 18 * s, (46 * s) | 0, col);
}
function renderHUD() {
  const W = view.w, H = view.h, s = view.s;
  const barH = view.hud;
  const top = H - barH;

  /* --------------------------- barra inferior ------------------------ */
  ctx.fillStyle = '#1b1712';
  ctx.fillRect(0, top, W, barH);

  g.addColorStop(0, 'rgba(255,255,255,0.10)');
  g.addColorStop(0.15, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = g; ctx.fillRect(0, top, W, barH);
  ctx.fillStyle = '#6b5a3c'; ctx.fillRect(0, top, W, 3 * s);

  const pad = 12 * s;
  const nBlocks = 4;
  const bw = Math.min(210 * s, (W - pad * 5) / nBlocks);
  let x = pad;
  const hpCol = P.hp > 60 ? '#7ee081' : (P.hp > 25 ? '#ffd45e' : '#ff5c5c');
  statBlock('SALUD', Math.round(P.hp) + '%', x, bw, top, barH, hpCol); x += bw + pad;
  statBlock('ARMADURA', Math.round(P.armor) + '%', x, bw, top, barH, '#6fb8ff'); x += bw + pad;

  /* cara del estudiante (a lo DOOM) */
  const faceW = Math.min(90 * s, W * 0.09), faceX = x + faceW / 2, faceY = top + barH / 2;
  ctx.fillStyle = '#0e0c0a';
  roundRect(ctx, x, top + 10 * s, faceW, barH - 20 * s, 6 * s, '#0e0c0a');
  drawFace(faceX, faceY, faceW * 0.42);
  x += faceW + pad;

  const wdef = WEAPONS[P.weapon];
  const am = wdef.ammo ? (wdef.ammo === 'ammo' ? P.ammo : P.exams) : '∞';
  statBlock('MUNICION', String(am), x, bw, top, barH, '#ffd45e'); x += bw + pad;

  /* arma actual + lista de armas */
  const wx = x, ww = Math.max(120 * s, W - x - pad);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(ctx, wx, top + 8 * s, ww, barH - 16 * s, 6 * s, 'rgba(0,0,0,0.35)');
  bigText('ARMA', wx + ww / 2, top + 32 * s, (19 * s) | 0, '#c9b48a');
  const nameSize = clamp(ww / (wdef.name.length * 0.55), 12 * s, 34 * s) | 0;
  bigText(wdef.name, wx + ww / 2, top + 62 * s, nameSize, '#ffe6a8');
  const slotW = Math.min(34 * s, ww / 5);
  for (let i = 0; i < 4; i++) {
    const sx2 = wx + ww / 2 - slotW * 2 + i * slotW;
    const own = P.owned[i];
    ctx.fillStyle = i === P.weapon ? '#ffcf5c' : (own ? '#5c5344' : '#2a2620');
    ctx.fillRect(sx2 + 2 * s, top + barH - 26 * s, slotW - 4 * s, 16 * s);
    bigText(String(i + 1), sx2 + slotW / 2, top + barH - 13 * s, (13 * s) | 0,
            i === P.weapon ? '#2a2008' : '#c9b48a', 'center', false);
  }

  /* --------------------------- BARRA DE JEFE ------------------------- */
  if (bossHUD && bossHUD.alive) {
    const bw2 = W * 0.62, bh = 34 * s, bx = (W - bw2) / 2, by = 22 * s;
    ctx.fillStyle = '#000';
    ctx.fillRect(bx - 5 * s, by - 5 * s, bw2 + 10 * s, bh + 10 * s);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, 3 * s);
    ctx.strokeRect(bx - 5 * s, by - 5 * s, bw2 + 10 * s, bh + 10 * s);
    ctx.fillStyle = '#140406';
    ctx.fillRect(bx, by, bw2, bh);
    const f = clamp(bossHUD.hp / bossHUD.maxHp, 0, 1);
    const gg = ctx.createLinearGradient(bx, by, bx, by + bh);
    gg.addColorStop(0, '#ff5b4d'); gg.addColorStop(0.5, '#d61616'); gg.addColorStop(1, '#7a0606');
    ctx.fillStyle = gg;
    ctx.fillRect(bx, by, bw2 * f, bh);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(bx, by, bw2 * f, bh * 0.35);
    bigText(bossHUD.def.name, W / 2, by + bh * 0.78, (26 * s) | 0, '#ffffff');
    bigText(Math.ceil(bossHUD.hp) + ' / ' + bossHUD.maxHp, W / 2, by + bh + 26 * s, (16 * s) | 0, '#ffb3b3');
  }

  /* ------------------------------- mira ------------------------------ */
  const cx = W / 2, cy = view.v3 / 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = Math.max(1, 2 * s);
  const gap = 6 * s, ln = 12 * s;
  ctx.beginPath();
  ctx.moveTo(cx - gap - ln, cy); ctx.lineTo(cx - gap, cy);
  ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + gap + ln, cy);
  ctx.moveTo(cx, cy - gap - ln); ctx.lineTo(cx, cy - gap);
  ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, cy + gap + ln);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,90,60,0.9)';
  ctx.fillRect(cx - 1.5 * s, cy - 1.5 * s, 3 * s, 3 * s);

  /* marcador de impacto */
  if (P.hitMark > 0 || P.killMark > 0) {
    const kill = P.killMark > 0;
    const a = kill ? P.killMark / 0.5 : P.hitMark / 0.22;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.strokeStyle = kill ? '#ff4a4a' : '#ffffff';
    ctx.lineWidth = Math.max(2, 3 * s);
    const r0 = (kill ? 12 : 8) * s, r1 = (kill ? 24 : 17) * s;
    ctx.beginPath();
    for (const [dx, dy] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
      ctx.moveTo(cx + dx * r0, cy + dy * r0);
      ctx.lineTo(cx + dx * r1, cy + dy * r1);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* de donde viene el dano */
  for (let i = hurtMarks.length - 1; i >= 0; i--) {
    const m = hurtMarks[i];
    const rel = m.ang - P.ang;
    ctx.globalAlpha = clamp(m.t, 0, 1) * 0.8;
    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = 9 * s;
    ctx.beginPath();
    ctx.arc(cx, cy, 96 * s, rel - Math.PI / 2 - 0.32, rel - Math.PI / 2 + 0.32);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ----------------------------- mensajes ---------------------------- */
  ctx.textAlign = 'left';
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    ctx.globalAlpha = clamp(m.t, 0, 1);
    bigText(m.text, 18 * s, (bossHUD ? 110 : 46) * s + i * 26 * s, (20 * s) | 0, m.col, 'left');
    ctx.globalAlpha = 1;
  }
  /* --------------------------- avisos de estado ---------------------- */
  ctx.textAlign = 'right';
  bigText(Math.floor(gameTime / 60) + ':' + String(Math.floor(gameTime % 60)).padStart(2, '0'),
          W - 16 * s, 34 * s, (20 * s) | 0, '#9aa0a6', 'right');
  bigText('PROFESORES ' + P.kills + '/' + killTotal, W - 16 * s, 58 * s, (18 * s) | 0, '#9aa0a6', 'right');
  bigText('PUNTOS ' + P.score, W - 16 * s, 80 * s, (18 * s) | 0, '#9aa0a6', 'right');
  bigText(DIFFS[diff].name, W - 16 * s, 100 * s, (15 * s) | 0, '#6f757d', 'right');

  /* claustro pendiente */
  let by2 = 132 * s;
  bigText('CLAUSTRO', W - 16 * s, by2, (16 * s) | 0, '#c9b48a', 'right');
  for (const id of ['R', 'D', 'A', 'J']) {
    by2 += 21 * s;
    const b = enemies.find(e => e.id === id);
    const vivo = b && b.alive;
    const nm = BOSSES[id].name;
    bigText(nm, W - 16 * s, by2, (16 * s) | 0, vivo ? '#ff8a7a' : '#4c5158', 'right');
    if (!vivo) {                                   /* tachado */
      ctx.strokeStyle = '#4c5158'; ctx.lineWidth = Math.max(1, 2 * s);
      const wtxt = ctx.measureText(nm).width;
      ctx.beginPath();
      ctx.moveTo(W - 16 * s - wtxt, by2 - 5 * s);
      ctx.lineTo(W - 16 * s, by2 - 5 * s);
      ctx.stroke();
    }
  }

  /* rotulo al despertar a un jefe */
  if (bossIntro) {
    const k = clamp(bossIntro.t / 2.4, 0, 1);
    ctx.globalAlpha = k < 0.25 ? k / 0.25 : 1;
    const sz = clamp(64 * s * (1 + (1 - k) * 0.12), 20, 120) | 0;
    bigText(bossIntro.name, W / 2, view.v3 * 0.34, sz, '#ff3b30');
    bigText('SE HA LEVANTADO DE LA SILLA', W / 2, view.v3 * 0.34 + 34 * s, (22 * s) | 0, '#ffd0c0');
    ctx.globalAlpha = 1;
  }

  /* ------------------------ destellos de pantalla -------------------- */
  if (P.pain > 0.01) {
    ctx.fillStyle = 'rgba(190,20,20,' + clamp(P.pain * 0.42, 0, 0.55) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (P.flash > 0) {
    ctx.fillStyle = 'rgba(255,220,150,' + clamp(P.flash * 0.7, 0, 0.22) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  /* vinetado */
  if (!vignette || vignette.w !== W) buildVignette();
  ctx.drawImage(vignette.c, 0, 0);
}
let vignette = null;
function buildVignette() {
  const c = makeCanvas(view.w, view.h), cc = c.getContext('2d');
  const g = cc.createRadialGradient(view.w / 2, view.h / 2, Math.min(view.w, view.h) * 0.32,
                                    view.w / 2, view.h / 2, Math.max(view.w, view.h) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.42)');
  cc.fillStyle = g; cc.fillRect(0, 0, view.w, view.h);

}
function drawFace(x, y, r) {
  const hurt = P.hp < 34, mid = P.hp < 67;
  ctx.save(); ctx.translate(x, y);
  ellipse(ctx, 0, 0, r, r * 1.12, hurt ? '#d79a7a' : '#eec49a');
  ctx.fillStyle = '#3a2a1a';                              /* pelo */
  ctx.beginPath(); ctx.ellipse(0, -r * 0.66, r * 1.02, r * 0.5, 0, Math.PI, TAU); ctx.fill();
  ellipse(ctx, -r * 0.38, -r * 0.05, r * 0.19, r * 0.16, '#fff');
  ellipse(ctx, r * 0.38, -r * 0.05, r * 0.19, r * 0.16, '#fff');
  const px = P.pain > 0.2 ? -r * 0.06 : 0;
  ellipse(ctx, -r * 0.38 + px, -r * 0.05, r * 0.08, r * 0.08, '#111');
  ellipse(ctx, r * 0.38 + px, -r * 0.05, r * 0.08, r * 0.08, '#111');
  ctx.fillStyle = '#8b3a3a';
  if (hurt) { ellipse(ctx, 0, r * 0.45, r * 0.28, r * 0.20, '#8b3a3a'); }
  else if (mid) { ctx.fillRect(-r * 0.28, r * 0.42, r * 0.56, r * 0.09); }
  else { ctx.beginPath(); ctx.ellipse(0, r * 0.32, r * 0.32, r * 0.22, 0, 0, Math.PI); ctx.fill(); }
  if (P.pain > 0.15) {                                    /* sangre */
    ctx.fillStyle = 'rgba(180,20,20,0.85)';

/* =====================================================================

let miniCache = null;

  cc.fillRect(0, 0, c.width, c.height);
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {

      if (!t) continue;

      cc.fillRect(x * cellPx, y * cellPx, cellPx, cellPx);

function renderMinimap() {
