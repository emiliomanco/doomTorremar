  const x0 = 14 * s, y0 = (bossHUD ? 110 : 46) * s + msgs.length * 26 * s;
  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.drawImage(miniCache.c, x0, y0);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
  ctx.strokeRect(x0, y0, miniCache.c.width, miniCache.c.height);
  for (const e of enemies) {
    if (!e.alive) continue;
    ctx.fillStyle = e.boss ? '#ff3b3b' : (e.id === 'M' ? '#5b8dff' : e.id === 'E' ? '#ff8a4a' : '#c9c9c9');
    const r = e.boss ? px * 1.2 : px * 0.7;
    ctx.beginPath(); ctx.arc(x0 + e.x * px, y0 + e.y * px, r, 0, TAU); ctx.fill();
  }
  for (const it of items) {
    if (it.taken) continue;
    ctx.fillStyle = '#7de08a';
    ctx.fillRect(x0 + it.x * px - px * 0.3, y0 + it.y * px - px * 0.3, px * 0.6, px * 0.6);
  }
  ctx.fillStyle = '#ffe45c';
  ctx.beginPath();
  ctx.moveTo(x0 + (P.x + P.dirX * 0.9) * px, y0 + (P.y + P.dirY * 0.9) * px);
  ctx.lineTo(x0 + (P.x - P.dirY * 0.5) * px, y0 + (P.y + P.dirX * 0.5) * px);
  ctx.lineTo(x0 + (P.x + P.dirY * 0.5) * px, y0 + (P.y - P.dirX * 0.5) * px);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* =====================================================================
   RENDER 6: PANTALLAS (menu / pausa / derrota / victoria)
   ===================================================================== */
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,6,10,0.88)';
  roundRect(ctx, x, y, w, h, 10 * view.s, 'rgba(8,6,10,0.88)');
  ctx.strokeStyle = '#8a1f1f'; ctx.lineWidth = Math.max(2, 3 * view.s);
  ctx.strokeRect(x, y, w, h);
}
function renderMenu() {
  const W = view.w, H = view.h, s = view.s;
  ctx.fillStyle = 'rgba(0,0,0,0.74)'; ctx.fillRect(0, 0, W, H);
  const lines = [
    ['MOVERSE', 'W A S D  ·  SHIFT para correr'],
    ['MIRAR', 'RATON (bloqueo de puntero)'],
    ['DISPARAR', 'CLIC IZQUIERDO / ESPACIO'],
    ['ARMAS', '1 REGLA · 2 TIZA · 3 ESCOPETA · 4 EXAMEN'],
    ['MAPA / SONIDO', 'TAB  ·  M'],
    ['SENSIBILIDAD', '[  ·  ]']
  ];
  const fs = clamp(20 * s, 13, 30);
  const ph = Math.min(H * 0.94, (420 + lines.length * 34) * s);
  const pw = Math.min(W * 0.94, 900 * s);
  const px = (W - pw) / 2, py = (H - ph) / 2;
  panel(px, py, pw, ph);
  const cx = W / 2;
  let y = py + 84 * s;
  bigText('T O R R E M A R', cx, y, clamp(72 * s, 34, 96) | 0, '#e02b2b'); y += 40 * s;
  bigText('EL DOOM DEL ESTUDIANTE', cx, y, clamp(26 * s, 14, 34) | 0, '#ffb347'); y += 54 * s;
  for (const [k, v] of lines) {
    bigText(k, cx - 16 * s, y, fs | 0, '#c9b48a', 'right');
    bigText(v, cx + 16 * s, y, fs | 0, '#e8e2d2', 'left');
    y += 34 * s;
  }
  y += 30 * s;
  bigText('OBJETIVO: EXPULSA A LOS 4 JEFES DEL CLAUSTRO', cx, y, clamp(21 * s, 12, 26) | 0, '#ff8a5c');
  y += 30 * s;
  bigText('ROBERTO · DAVID · ARTURO · JORGE CORONEL', cx, y, clamp(19 * s, 11, 24) | 0, '#9fd0ff');
  y += 40 * s;
  bigText('DIFICULTAD  (teclas 1-3)', cx, y, clamp(19 * s, 11, 24) | 0, '#c9b48a');
  y += 30 * s;
  const dw = Math.min(pw * 0.29, 250 * s);
  for (let i = 0; i < DIFFS.length; i++) {
    const bx = cx + (i - 1) * (dw + 8 * s) - dw / 2;
    const act = i === diff;
    ctx.fillStyle = act ? '#8a1f1f' : 'rgba(255,255,255,0.06)';
    roundRect(ctx, bx, y - 20 * s, dw, 28 * s, 5 * s, ctx.fillStyle);
    bigText(DIFFS[i].name, bx + dw / 2, y, clamp(19 * s, 11, 23) | 0, act ? '#ffe45c' : '#8f8878');
  }
  y += 24 * s;
  bigText(DIFFS[diff].desc, cx, y, clamp(16 * s, 10, 20) | 0, '#8f8878');
  y += 44 * s;
  const blink = 0.55 + 0.45 * Math.sin(performance.now() / 260);
  ctx.globalAlpha = blink;
  bigText('CLIC PARA ENTRAR AL INSTITUTO', cx, y, clamp(30 * s, 16, 38) | 0, '#ffe45c');
  ctx.globalAlpha = 1;
}
function renderPause() {
  const W = view.w, H = view.h, s = view.s;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  bigText('PAUSA', W / 2, H / 2 - 20 * s, (72 * s) | 0, '#ffb347');
  bigText('CLIC PARA CONTINUAR', W / 2, H / 2 + 34 * s, (26 * s) | 0, '#e8e2d2');
}
function renderEnd() {
  const W = view.w, H = view.h, s = view.s;
  const win = endStats && endStats.win;
  ctx.fillStyle = win ? 'rgba(10,26,14,0.82)' : 'rgba(40,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W * 0.86, 760 * s), ph = Math.min(H * 0.8, 470 * s);
  panel((W - pw) / 2, (H - ph) / 2, pw, ph);
  const cx = W / 2; let y = (H - ph) / 2 + 96 * s;
  if (win) {
    bigText('¡APROBADO!', cx, y, (74 * s) | 0, '#7ee081'); y += 44 * s;
    bigText('EL CLAUSTRO AL COMPLETO HA CAIDO', cx, y, (24 * s) | 0, '#d7f5d8');
  } else {
    bigText('EXPULSADO', cx, y, (74 * s) | 0, '#ff4a4a'); y += 44 * s;
    bigText('LOS PROFESORES TE HAN PODIDO', cx, y, (24 * s) | 0, '#ffc9c9');
  }
  y += 62 * s;
  const st = endStats || { time: 0, kills: 0, total: 0, score: 0 };
  const rows = [
    ['PROFESORES ELIMINADOS', st.kills + ' / ' + st.total],
    ['TIEMPO', Math.floor(st.time / 60) + ':' + String(Math.floor(st.time % 60)).padStart(2, '0')],
    ['PUNTUACION', String(st.score)],
    ['DIFICULTAD', DIFFS[diff].name]
  ];
  for (const [k, v] of rows) {
    bigText(k, cx - 24 * s, y, (24 * s) | 0, '#c9b48a', 'right');
    bigText(v, cx + 24 * s, y, (26 * s) | 0, '#ffe45c', 'left');
    y += 40 * s;
  }
  y += 26 * s;
  const blink = 0.55 + 0.45 * Math.sin(performance.now() / 260);
  ctx.globalAlpha = blink;
  bigText('CLIC O [R] PARA VOLVER A EMPEZAR', cx, y, (26 * s) | 0, '#ffffff');
  ctx.globalAlpha = 1;
}

/* =====================================================================
   BUCLE PRINCIPAL  (deltaTime para movimiento independiente de los FPS)
   ===================================================================== */
let last = 0, fpsT = 0, fpsN = 0, fps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);                       /* evita saltos tras un lag */

  if (state === 'play') {
    gameTime += dt;
    updatePlayer(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
    updateEffects(dt);
  } else {
    updateEffects(dt * 0.5);
  }

  /* sacudida de camara al recibir dano */
  const shX = P.shake ? rnd(-P.shake, P.shake) * view.s * 0.35 : 0;
  const shY = P.shake ? rnd(-P.shake, P.shake) * view.s * 0.35 : 0;
  ctx.save();
  if (shX || shY) ctx.translate(shX, shY);
  ctx.beginPath();
  ctx.rect(-Math.abs(shX) - 2, -Math.abs(shY) - 2, view.w + Math.abs(shX) * 2 + 4, view.v3 + Math.abs(shY) + 2);
  ctx.clip();                                     /* el mundo nunca invade el HUD */
  renderWorld();
  renderSprites();
  if (state !== 'menu') renderWeapon();
  ctx.restore();

  if (state !== 'menu') {
    renderHUD();
    if (showMap) renderMinimap();
  }
  if (state === 'menu') renderMenu();
  else if (state === 'pause') renderPause();
  else if (state === 'dead' || state === 'win') renderEnd();

  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { fps = Math.round(fpsN / fpsT); fpsT = 0; fpsN = 0; }
  if (showMap) {
    ctx.textAlign = 'right';
    bigText(fps + ' FPS', view.w - 16 * view.s, view.h - 106 * view.s, (16 * view.s) | 0, '#7f8790', 'right');
  }
}

/* ------------------------------ ARRANQUE ------------------------------ */
resize();
resetGame();
state = 'menu';
requestAnimationFrame(frame);
</script>
